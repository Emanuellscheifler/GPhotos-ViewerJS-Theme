name: Build MSI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build MSI (unsigned)
        run: npm run dist

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Visualizador-de-Fotos-msi
          path: dist/*.msi
          if-no-files-found: error
          retention-days: 14
